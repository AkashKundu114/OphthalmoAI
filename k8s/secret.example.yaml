apiVersion: v1
kind: Secret
metadata:
  name: ophthalmoai-secrets
  namespace: ophthalmoai
type: Opaque
stringData:
  JWT_SECRET_KEY: "replace-with-64-character-hex-secret"
  GEMINI_API_KEY: "replace-with-gemini-api-key"
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/ophthalmoai"
