# Example secrets manifest for OphthalmoAI
# Usage:
#   1. Copy this file to secret.yaml (which is gitignored)
#   2. Fill in the values below:
#      - JWT_SECRET_KEY: python -c "import secrets; print(secrets.token_hex(32))"
#      - GEMINI_API_KEY: from https://ai.google.dev/
#      - DATABASE_URL: postgresql+asyncpg://user:pass@postgres-host:5432/ophthalmoai?ssl=require
#   3. kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ophthalmoai-secrets
  namespace: ophthalmoai
type: Opaque
stringData:
  JWT_SECRET_KEY: "replace-with-64-character-hex-secret"
  GEMINI_API_KEY: "replace-with-gemini-api-key"
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/ophthalmoai"
