apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ophthalmoai
  labels:
    app: ophthalmoai
    component: backend
    app.kubernetes.io/name: ophthalmoai-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: ophthalmoai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ophthalmoai
      component: backend
  template:
    metadata:
      labels:
        app: ophthalmoai
        component: backend
        app.kubernetes.io/name: ophthalmoai-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: ophthalmoai
    spec:
      containers:
        - name: backend
          image: ophthalmoai-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ophthalmoai-config
            - secretRef:
                name: ophthalmoai-secrets
                optional: true
          resources:
            requests:
              cpu: "500m"
              memory: "1536Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          # Startup probe protects against PyTorch model cold-start timeouts
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
